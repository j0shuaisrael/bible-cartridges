<!DOCTYPE html>
<!--
  Bible Cartridges — chapter viewer (TEMPLATE for all 150 Psalms).
  A floating scroll in a first-person 3D scene. The scroll carries the
  chapter decoded from its cartridge PNG (see chapter.js in this folder):
  Hebrew text, transliteration and a gloss in the viewer's device language,
  plus the chapter reading as Opus audio, played on tap.

  Nothing chapter-specific lives in this file: the chapter number, titles
  and filenames come from chapter.js, and the text/glosses/audio come from
  the cartridge. To make another psalm's page, copy this whole folder and
  replace chapter.js, cartridge.png, audio.webm and cover.png.

  GLB credits (to be filled in by Pol): Cloud Palace — [author];
  Anime Skybox — [author].
  (Credits live only in this comment, never in the 3D scene itself.)

  Run by serving this folder over HTTP, e.g. from the project root:
      python3 -m http.server 8000
  then open http://localhost:8000/psalms/NNN/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bible Cartridge</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020;
    font-family: system-ui, -apple-system, sans-serif; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #title { position: fixed; top: 10px; left: 14px; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); font-size: 15px; pointer-events: none; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 16px;
    font-size: 13px; white-space: nowrap; pointer-events: none; }
  #status { position: fixed; top: 10px; right: 14px; color: #cfe3ff; font-size: 11px;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); text-align: right; pointer-events: none; }
  #joy { position: fixed; left: 22px; bottom: 54px; width: 112px; height: 112px;
    border-radius: 50%; background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  #knob { position: absolute; left: 31px; top: 31px; width: 50px; height: 50px;
    border-radius: 50%; background: rgba(255,255,255,.55); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div id="title"></div>
<div id="status">loading…</div>
<div id="hint">Tap the scroll to play the reading · drag the scroll to read on · drag elsewhere to look around</div>
<div id="joy"><div id="knob"></div></div>
<audio id="chap-audio" preload="auto"></audio>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { decodeCartridge, pickLanguage, intercalate } from './decode.js';
import { CHAPTER } from './chapter.js';

// Chapter metadata (titles, filenames) comes from chapter.js — the viewer
// itself holds nothing chapter-specific.
document.title = CHAPTER.title + ' — Bible Cartridge';
document.getElementById('title').textContent = CHAPTER.title;
document.getElementById('chap-audio').src = CHAPTER.audio;

// ---------------------------------------------------------------- status --
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
window.__psalmStatus = { ready: false, errors: [], lang: null };
function setStatus(text) { statusEl.textContent = text; }
function fail(msg) {
  window.__psalmStatus.errors.push(msg);
  setStatus('ERROR: ' + msg);
  console.error(msg);
}

// Query params (for testing): ?lang=en|es  ?scroll=0..1
const params = new URLSearchParams(location.search);
const forcedLang = params.get('lang');
const forcedScroll = params.has('scroll') ? Math.min(1, Math.max(0, parseFloat(params.get('scroll')) || 0)) : null;

// ------------------------------------------------------- scroll text canvas --
// The scroll shows the chapter decoded from the cartridge, one intercalated
// token per word:  HEBREW (transliteration, gloss-in-device-language).
// Hebrew runs right-to-left; each wrapped line is drawn as one fillText
// with direction 'rtl' so the browser's bidi algorithm orders the Hebrew
// words and the Latin parentheticals correctly.
const CW = 1400;                 // canvas width (px)
const PAD = 80;                  // side padding (px)
// Font stack: the first face covers Hebrew, the second covers the Latin
// transliteration/gloss — canvas fillText falls back per character, so one
// draw call per line keeps the bidi order right in both scripts.
const FONT = '46px "Noto Serif Hebrew", "Noto Serif", "Times New Roman", serif';
const FONT_BOLD = 'bold 58px "Noto Serif Hebrew", "Noto Serif", "Times New Roman", serif';
const FONT_SEP = '34px "Noto Serif Hebrew", "Noto Serif", "Times New Roman", serif';
const LINE_H = 78;
const SHEET_W = 7, SHEET_H = 3.5; // world units; visible window aspect 2:1

function layoutScrollText(verses) {
  const c = document.createElement('canvas');
  c.width = CW;
  const ctx = c.getContext('2d');
  ctx.font = FONT;
  const maxW = CW - PAD * 2;
  const lines = []; // {text, kind: 'head'|'verse'|'sep'|'text'}
  lines.push({ text: CHAPTER.title, kind: 'head' });
  lines.push({ text: CHAPTER.hebrewTitle, kind: 'head' });
  verses.forEach((tokens, vi) => {
    lines.push({ text: `— ${vi + 1} —`, kind: 'sep' });
    let cur = '';
    for (const tok of tokens) {
      const next = cur ? cur + ' ' + tok : tok;
      if (ctx.measureText(next).width > maxW && cur) {
        lines.push({ text: cur, kind: 'text' });
        cur = tok;
      } else {
        cur = next;
      }
    }
    if (cur) lines.push({ text: cur, kind: 'text' });
  });
  const canvasH = Math.max(700, lines.length * LINE_H + PAD * 2);
  c.height = canvasH;
  const g = c.getContext('2d');
  g.fillStyle = '#efe3c0'; // parchment
  g.fillRect(0, 0, CW, canvasH);
  g.fillStyle = '#2a2118';
  g.textBaseline = 'middle';
  let y = PAD + LINE_H / 2;
  for (const ln of lines) {
    if (ln.kind === 'head') {
      g.font = FONT_BOLD;
      g.direction = 'ltr'; g.textAlign = 'center';
      g.fillText(ln.text, CW / 2, y);
      g.font = FONT;
    } else if (ln.kind === 'sep') {
      g.font = FONT_SEP;
      g.direction = 'ltr'; g.textAlign = 'center';
      g.fillText(ln.text, CW / 2, y);
      g.font = FONT;
    } else {
      g.direction = 'rtl'; g.textAlign = 'right';
      g.fillText(ln.text, CW - PAD, y);
    }
    y += LINE_H;
  }
  return { canvas: c, canvasH };
}

// ------------------------------------------------------------------ scene --
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
let yaw = 0, pitch = -0.06;
const EYE_Y = 2.0;
camera.position.set(0, EYE_Y, 11);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x8a6f4d, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(20, 30, 10);
scene.add(sun);

const loader = new GLTFLoader();
const loadState = { palace: false, skybox: false, cartridge: false };

function recenterOnFloor(group) {
  const box = new THREE.Box3().setFromObject(group);
  const c = box.getCenter(new THREE.Vector3());
  group.position.x -= c.x;
  group.position.z -= c.z;
  group.position.y -= box.min.y;
  return box;
}

loader.load('../../assets/cloud-palace.glb', (g) => {
  recenterOnFloor(g.scene);
  // IMPORTANT: setFromObject() below reads matrixWorld, which is stale until
  // this runs — without it the floor bbox comes back in the pre-recenter
  // frame and the shift below lands ~3.3 units too high, putting the camera
  // under the whole palace.
  g.scene.updateMatrixWorld(true);
  // The palace's walkable floor is NOT the bounding-box bottom: the flat
  // floor plane (the flattest mesh — a 13x13 slab, only ~50 verts) sits
  // ~2.8 units above the bbox min, on top of a base plinth. If the camera
  // stands at y=2.0 against the bbox floor, it ends up UNDER the floor
  // plane, which then hides the scroll's top half and most of the hall.
  // So: shift the palace down until the floor plane's centre is at y=0.
  let floor = null, floorFlat = Infinity;
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    const b = new THREE.Box3().setFromObject(o);
    const s = b.getSize(new THREE.Vector3());
    const flat = s.y / Math.max(s.x, s.z);
    if (flat < floorFlat) { floorFlat = flat; floor = b; }
  });
  if (floor) {
    const c = floor.getCenter(new THREE.Vector3());
    g.scene.position.y -= c.y;
  }
  scene.add(g.scene);
  loadState.palace = true;
  refreshStatus();
}, undefined, (e) => fail('palace GLB failed to load: ' + (e?.message || e)));

loader.load('../../assets/skybox.glb', (g) => {
  g.scene.traverse((o) => {
    if (o.isMesh) {
      o.material.side = THREE.BackSide; // we stand inside the sky sphere
      o.material.depthWrite = false;
    }
  });
  // The file's sphere is radius 1 in local space but its nodes carry a
  // ~500x matrix, so as loaded it already spans ~1000 units. Measure it and
  // scale to a ~60-unit radius instead of assuming a scale: a blind 60x
  // would have made it 60,000 units and invisible past the far plane.
  const box = new THREE.Box3().setFromObject(g.scene);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const s = 120 / Math.max(size.x, size.y, size.z);
  g.scene.scale.setScalar(s);
  g.scene.position.set(-c.x * s, 9 - c.y * s, -c.z * s);
  g.scene.renderOrder = -1;
  scene.add(g.scene);
  loadState.skybox = true;
  refreshStatus();
}, undefined, (e) => fail('skybox GLB failed to load: ' + (e?.message || e)));

// ------------------------------------------------------------------ scroll --
const scrollGroup = new THREE.Group();
const TAN = 0xc8a06a, TAN_DARK = 0xb08d55, WOOD = 0x7a5230;
let scrollTex = null;
let scrollFrac = forcedScroll ?? 0;
let scrollMaxFrac = 0; // 1 - visible fraction of the text canvas

function buildScrollTexture(verses) {
  const { canvas, canvasH } = layoutScrollText(verses);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  const visibleH = CW * (SHEET_H / SHEET_W);
  const repeatY = Math.min(1, visibleH / canvasH);
  tex.repeat.set(1, repeatY);
  scrollMaxFrac = 1 - repeatY;
  applyScrollOffset(tex);
  return tex;
}
function applyScrollOffset(tex) {
  // frac 0 = top of the text, 1 = bottom. (flipY: v=1 is the canvas top.)
  tex.offset.y = (1 - tex.repeat.y) * (1 - scrollFrac);
}

const sheetMats = [
  new THREE.MeshStandardMaterial({ color: TAN_DARK, roughness: 0.9 }), // +x
  new THREE.MeshStandardMaterial({ color: TAN_DARK, roughness: 0.9 }), // -x
  new THREE.MeshStandardMaterial({ color: TAN_DARK, roughness: 0.9 }), // +y
  new THREE.MeshStandardMaterial({ color: TAN_DARK, roughness: 0.9 }), // -y
  new THREE.MeshStandardMaterial({ roughness: 0.9 }),                  // +z front (text)
  new THREE.MeshStandardMaterial({ color: TAN_DARK, roughness: 0.9 }), // -z back
];
const sheet = new THREE.Mesh(new THREE.BoxGeometry(SHEET_W, SHEET_H, 0.06), sheetMats);
sheet.name = 'scroll-sheet';
scrollGroup.add(sheet);

const rollGeo = new THREE.CylinderGeometry(0.42, 0.42, 3.9, 24);
const rollMat = new THREE.MeshStandardMaterial({ color: TAN, roughness: 0.85 });
const rodGeo = new THREE.CylinderGeometry(0.07, 0.07, 4.7, 12);
const rodMat = new THREE.MeshStandardMaterial({ color: WOOD, roughness: 0.8 });
const capGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 24);
const capMat = new THREE.MeshStandardMaterial({ color: WOOD, roughness: 0.8 });
for (const side of [-1, 1]) {
  const x = side * (SHEET_W / 2 + 0.30); // sheet edge tucks into the roll
  const roll = new THREE.Mesh(rollGeo, rollMat);
  roll.position.set(x, 0, 0);
  scrollGroup.add(roll);
  const rod = new THREE.Mesh(rodGeo, rodMat);
  rod.position.set(x, 0, 0);
  scrollGroup.add(rod);
  for (const end of [-1, 1]) {
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.set(x, end * 1.98, 0);
    scrollGroup.add(cap);
  }
}
// Sheet connects to the rolls on the backside: the sheet plane sits slightly
// behind the roll centres; the text faces +z, toward the arriving visitor.
sheet.position.z = -0.30;
// The scroll floats above the palace's central feature (a low step/dais
// rising to y≈1.57 at the platform centre): its sheet bottom sits at 1.85,
// clear of it even at the lowest point of the bob.
scrollGroup.position.set(0, 3.6, 0);
scene.add(scrollGroup);

// ------------------------------------------------------- cartridge + audio --
const audio = document.getElementById('chap-audio');
let audioReady = false;
audio.addEventListener('canplay', () => { audioReady = true; refreshStatus(); });
audio.addEventListener('error', () => {
  hintEl.textContent = 'Audio file not available — the scroll still reads fine.';
  refreshStatus();
});
function toggleAudio() {
  if (!audioReady || !audio.src) {
    hintEl.textContent = 'Audio file not available yet.';
    return;
  }
  if (audio.paused) {
    audio.play().catch(() => { hintEl.textContent = 'Audio could not start.'; });
    hintEl.textContent = '❚❚ Playing the reading — tap the scroll to pause';
  } else {
    audio.pause();
    hintEl.textContent = '▶ Paused — tap the scroll to play the reading';
  }
}

let langUsed = null;
decodeCartridge(CHAPTER.cartridge).then(({ header, pack }) => {
  const deviceLang = forcedLang || navigator.language || 'en';
  langUsed = pickLanguage(header, deviceLang);
  window.__psalmStatus.lang = langUsed;
  const verses = intercalate(pack, langUsed);
  scrollTex = buildScrollTexture(verses);
  sheetMats[4].map = scrollTex;
  sheetMats[4].needsUpdate = true;
  loadState.cartridge = true;
  refreshStatus();
}).catch((e) => {
  // Graceful failure: the scene still loads, the scroll says so.
  fail('cartridge decode failed: ' + e.message);
  const c = document.createElement('canvas');
  c.width = CW; c.height = 700;
  const g = c.getContext('2d');
  g.fillStyle = '#efe3c0'; g.fillRect(0, 0, CW, 700);
  g.fillStyle = '#2a2118'; g.font = '40px sans-serif';
  g.textAlign = 'center';
  g.fillText('Cartridge could not be decoded.', CW / 2, 320);
  g.fillText(String(e.message).slice(0, 90), CW / 2, 400);
  scrollTex = new THREE.CanvasTexture(c);
  scrollTex.colorSpace = THREE.SRGBColorSpace;
  sheetMats[4].map = scrollTex;
  sheetMats[4].needsUpdate = true;
});

function refreshStatus() {
  const bits = [
    'palace ' + (loadState.palace ? 'OK' : '…'),
    'skybox ' + (loadState.skybox ? 'OK' : '…'),
    'cartridge ' + (loadState.cartridge ? 'OK' : '…'),
    langUsed ? ('lang ' + langUsed) : '',
    audioReady ? 'audio OK' : 'audio …',
  ].filter(Boolean);
  setStatus(bits.join(' · '));
  if (loadState.palace && loadState.skybox && loadState.cartridge) {
    window.__psalmStatus.ready = true;
  }
}

// --------------------------------------------------------------- controls --
// First person: joystick (bottom-left) or WASD moves on the platform;
// drag anywhere else to look around; drag the scroll itself to read on.
const keys = {};
addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
let joyVec = { x: 0, y: 0 };
let joyId = null;
function joySet(cx, cy) {
  const r = joy.getBoundingClientRect();
  let dx = (cx - (r.left + r.width / 2)) / (r.width / 2);
  let dy = (cy - (r.top + r.height / 2)) / (r.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  if (len < 0.12) { dx = 0; dy = 0; } // dead zone
  joyVec = { x: dx, y: dy };
  knob.style.left = 31 + dx * 30 + 'px';
  knob.style.top = 31 + dy * 30 + 'px';
}
joy.addEventListener('pointerdown', (e) => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joySet(e.clientX, e.clientY); });
joy.addEventListener('pointermove', (e) => { if (e.pointerId === joyId) joySet(e.clientX, e.clientY); });
function joyEnd(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec = { x: 0, y: 0 };
  knob.style.left = '31px'; knob.style.top = '31px';
}
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let dragMode = null; // 'look' | 'scroll'
let downPos = null, downTime = 0, lastPos = null;
function pickScroll(e) {
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  return ray.intersectObject(sheet, false).length > 0;
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
  downTime = performance.now();
  lastPos = { x: e.clientX, y: e.clientY };
  dragMode = pickScroll(e) ? 'scroll' : 'look';
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragMode || !lastPos) return;
  const dx = e.clientX - lastPos.x, dy = e.clientY - lastPos.y;
  lastPos = { x: e.clientX, y: e.clientY };
  if (dragMode === 'look') {
    yaw -= dx * 0.004;
    pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * 0.004));
  } else if (dragMode === 'scroll' && scrollTex && scrollMaxFrac > 0) {
    scrollFrac = Math.min(1, Math.max(0, scrollFrac - dy * 0.002));
    applyScrollOffset(scrollTex);
  }
});
renderer.domElement.addEventListener('pointerup', (e) => {
  // A short, still press on the scroll is a tap: play / pause the reading.
  if (dragMode === 'scroll' && downPos) {
    const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    if (moved < 8 && performance.now() - downTime < 500) toggleAudio();
  }
  dragMode = null; downPos = null; lastPos = null;
});
renderer.domElement.addEventListener('pointercancel', () => {
  dragMode = null; downPos = null; lastPos = null;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ------------------------------------------------------------------- loop --
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // The scroll floats: a gentle bob, no spin (the text must stay readable).
  scrollGroup.position.y = 3.6 + Math.sin(t * 0.8) * 0.12;

  // Movement: joystick + WASD, relative to where the camera faces.
  let mx = joyVec.x, mz = joyVec.y;
  if (keys['w'] || keys['arrowup']) mz -= 1;
  if (keys['s'] || keys['arrowdown']) mz += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  const len = Math.hypot(mx, mz);
  if (len > 0.01) {
    const sp = 4 * dt * Math.min(len, 1);
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    camera.position.x += (-sin * -mz + cos * mx) * sp;
    camera.position.z += (-cos * -mz - sin * mx) * sp;
    // Stay on the platform (palace spans ~28 units).
    const r = Math.hypot(camera.position.x, camera.position.z);
    if (r > 11) {
      camera.position.x *= 11 / r;
      camera.position.z *= 11 / r;
    }
    camera.position.y = EYE_Y;
  }
  camera.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera);
}

// Debug hook (only with ?debug): lets a headless check inspect the exact
// scroll texture, camera and scene instead of guessing.
if (new URLSearchParams(location.search).has('debug')) {
  window.__psalmDebug = {
    get scrollTex() { return scrollTex; },
    get scrollFrac() { return scrollFrac; },
    get scrollMaxFrac() { return scrollMaxFrac; },
    camera, scene, scrollGroup, THREE,
  };
}
animate();
</script>
</body>
</html>
